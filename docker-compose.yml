services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academix}
      POSTGRES_USER: ${POSTGRES_USER:-academix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academix_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    command: ["sh", "-c", "node dist/commands/migrate.js && exec node dist/main.js"]
    build:
      context: ./backend
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      APP_VERSION: 0.1.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-academix}:${POSTGRES_PASSWORD:-academix_dev}@postgres:5432/${POSTGRES_DB:-academix}
      DEMO_UC_PASSWORD: ${DEMO_UC_PASSWORD:-}
      DEMO_UTFSM_PASSWORD: ${DEMO_UTFSM_PASSWORD:-}
      DEMO_MULTI_PASSWORD: ${DEMO_MULTI_PASSWORD:-}
      DEMO_REVOKED_PASSWORD: ${DEMO_REVOKED_PASSWORD:-}
      DEMO_INACTIVE_PASSWORD: ${DEMO_INACTIVE_PASSWORD:-}
      PORT: 3001
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/ready').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      API_URL: http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
