services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academix}
      POSTGRES_USER: ${POSTGRES_USER:-academix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academix_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    command: ["sh", "-c", "node dist/commands/predeploy.js && exec node dist/commands/start.js"]
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      APP_VERSION: 0.1.0
      DATABASE_URL: postgresql://academix_runtime:${RUNTIME_PASSWORD:-runtime_dev}@postgres:5432/${POSTGRES_DB:-academix}
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-academix}:${POSTGRES_PASSWORD:-academix_dev}@postgres:5432/${POSTGRES_DB:-academix}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["http://uc.localhost:3000","http://utfsm.localhost:3000"]}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-false}
      DEMO_ACADEMIC_DATA_ENABLED: ${DEMO_ACADEMIC_DATA_ENABLED:-false}
      DEMO_ADOPT_LEGACY: ${DEMO_ADOPT_LEGACY:-false}
      DEMO_OPERATOR_REF: ${DEMO_OPERATOR_REF:-}
      DEMO_UC_PASSWORD: ${DEMO_UC_PASSWORD:-}
      DEMO_UTFSM_PASSWORD: ${DEMO_UTFSM_PASSWORD:-}
      DEMO_MULTI_PASSWORD: ${DEMO_MULTI_PASSWORD:-}
      DEMO_REVOKED_PASSWORD: ${DEMO_REVOKED_PASSWORD:-}
      DEMO_INACTIVE_PASSWORD: ${DEMO_INACTIVE_PASSWORD:-}
      DEMO_UC_SUPERADMIN_PASSWORD: ${DEMO_UC_SUPERADMIN_PASSWORD:-}
      DEMO_UC_ADMIN_PASSWORD: ${DEMO_UC_ADMIN_PASSWORD:-}
      DEMO_UC_TEACHER_PASSWORD: ${DEMO_UC_TEACHER_PASSWORD:-}
      DEMO_UC_ASSISTANT_PASSWORD: ${DEMO_UC_ASSISTANT_PASSWORD:-}
      DEMO_UC_STUDENT_PASSWORD: ${DEMO_UC_STUDENT_PASSWORD:-}
      DEMO_UTFSM_SUPERADMIN_PASSWORD: ${DEMO_UTFSM_SUPERADMIN_PASSWORD:-}
      DEMO_UTFSM_ADMIN_PASSWORD: ${DEMO_UTFSM_ADMIN_PASSWORD:-}
      DEMO_UTFSM_TEACHER_PASSWORD: ${DEMO_UTFSM_TEACHER_PASSWORD:-}
      DEMO_UTFSM_ASSISTANT_PASSWORD: ${DEMO_UTFSM_ASSISTANT_PASSWORD:-}
      DEMO_UTFSM_STUDENT_PASSWORD: ${DEMO_UTFSM_STUDENT_PASSWORD:-}
      AVATAR_STORAGE_DRIVER: ${AVATAR_STORAGE_DRIVER:-local}
      AVATAR_LOCAL_DIR: /app/data
      ACADEMIC_STORAGE_DRIVER: ${ACADEMIC_STORAGE_DRIVER:-local}
      ACADEMIC_LOCAL_DIR: /app/data
      S3_ACADEMIC_BUCKET: ${S3_ACADEMIC_BUCKET:-}
      ACADEMIC_DOCUMENT_LIMIT_MIB: ${ACADEMIC_DOCUMENT_LIMIT_MIB:-20}
      ACADEMIC_IMAGE_LIMIT_MIB: ${ACADEMIC_IMAGE_LIMIT_MIB:-10}
      ACADEMIC_ZIP_LIMIT_MIB: ${ACADEMIC_ZIP_LIMIT_MIB:-50}
      AWS_REGION: ${AWS_REGION:-}
      S3_AVATAR_BUCKET: ${S3_AVATAR_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      MAIL_DELIVERY_MODE: ${MAIL_DELIVERY_MODE:-disabled}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-AcademiX <no-reply@mail.academix.dvillasc.me>}
      ACTIVATION_ORIGINS_BY_INSTITUTION: ${ACTIVATION_ORIGINS_BY_INSTITUTION:-}
      PORT: 3001
    volumes:
      - avatar_data:/app/data
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/ready').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_INSTITUTION_ORIGINS: ${NEXT_PUBLIC_INSTITUTION_ORIGINS:?Configure institutional origins before building}
        NEXT_PUBLIC_PORTAL_ORIGIN: ${NEXT_PUBLIC_PORTAL_ORIGIN:?Configure the public portal origin before building}
    environment:
      API_URL: http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  avatar_data:
