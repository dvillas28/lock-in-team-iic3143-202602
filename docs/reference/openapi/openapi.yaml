openapi: 3.1.0
info:
  title: AcademiX API
  version: 0.3.0
  description: >-
    API de AcademiX. Obtén un token en login y úsalo como Bearer.
    Elige tu institución con GET /api/v1/institutions.
    Consulta permisos y ejemplos dentro de cada operación.
servers:
- url: https://api.dvillasc.me
  description: API central
- url: http://localhost:3001
  description: Desarrollo local
security:
- bearerAuth: []
tags:
- name: Authentication
  description: Identidad global.
- name: Platform
  description: Salud del servicio.
- name: Institutions
  description: Descubrimiento de Institutions e identidad contextual.
- name: Courses
  description: Consulta y configuración general de cursos.
- name: Sections
  description: Secciones académicas de un curso.
- name: Enrollments
  description: Participantes y roles contextuales por sección.
- name: Modules
  description: Organización y publicación de módulos de contenido.
- name: Materials
  description: Material markdown y archivos académicos publicados.
- name: Quizzes
  description: Autoría, consulta y publicación de quizzes autocorregidos.
- name: Assignments
  description: Autoría, visibilidad y consulta de tareas del curso.
- name: Attempts
  description: Intentos, respuestas, envío y cancelación de quizzes.
- name: Gradebook
  description: Ponderaciones, notas, publicación y promedios derivados.
- name: Audit
  description: Consulta inmutable del historial académico sensible.
- name: Accounts
  description: Perfil global propio, invitaciones institucionales e importaciones efímeras.
