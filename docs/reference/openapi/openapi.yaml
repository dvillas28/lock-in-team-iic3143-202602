openapi: 3.1.0
info:
  title: AcademiX API
  version: 0.1.0
  description: |
    Contrato HTTP del MVP académico multi-tenant de AcademiX.

    `x-tenant` selecciona el tenant y su base de datos, pero no autentica ni
    autoriza al usuario. La identidad de las operaciones académicas se obtiene
    del claim `sub` del JWT y los permisos se resuelven desde las memberships
    persistidas por AcademiX.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
    description: Host actual
security:
  - bearerAuth: []
tags:
  - name: Platform
    description: Salud del servicio y prueba pública de resolución de tenant.
  - name: Tenants
    description: Descubrimiento de tenants e identidad contextual autenticada.
  - name: Courses
    description: Consulta y configuración general de cursos.
  - name: Sections
    description: Secciones académicas de un curso.
  - name: Enrollments
    description: Participantes y roles contextuales por sección.
  - name: Modules
    description: Organización y publicación de módulos de contenido.
  - name: Materials
    description: Material markdown y archivos académicos publicados.
  - name: Quizzes
    description: Autoría, consulta y publicación de quizzes autocorregidos.
  - name: Attempts
    description: Intentos, respuestas, envío y cancelación de quizzes.
  - name: Gradebook
    description: Ponderaciones, notas, publicación y promedios derivados.
  - name: Audit
    description: Consulta inmutable del historial de acciones académicas sensibles.
