openapi: 3.1.0
info:
  title: AcademiX API
  version: 0.2.0
  description: |
    Contrato HTTP del MVP académico multi-tenant de AcademiX.

    El JWT identifica un User global. Los recursos académicos se solicitan bajo
    `/api/v1/institutions/{institutionSlug}`. El slug no concede acceso: el
    backend valida InstitutionMembership y permisos académicos antes de ejecutar
    una operación. Los bodies no aceptan `institutionId` como fuente de scope.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
    description: Host actual
security:
  - bearerAuth: []
tags:
  - name: Platform
    description: Salud del servicio.
  - name: Institutions
    description: Descubrimiento de Institutions e identidad contextual.
  - name: Courses
    description: Consulta y configuración general de cursos.
  - name: Sections
    description: Secciones académicas de un curso.
  - name: Enrollments
    description: Participantes y roles contextuales por sección.
  - name: Modules
    description: Organización y publicación de módulos de contenido.
  - name: Materials
    description: Material markdown y archivos académicos publicados.
  - name: Quizzes
    description: Autoría, consulta y publicación de quizzes autocorregidos.
  - name: Attempts
    description: Intentos, respuestas, envío y cancelación de quizzes.
  - name: Gradebook
    description: Ponderaciones, notas, publicación y promedios derivados.
  - name: Audit
    description: Consulta inmutable del historial académico sensible.
