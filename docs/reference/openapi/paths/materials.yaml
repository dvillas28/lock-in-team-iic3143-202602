/api/v1/institutions/{institutionSlug}/modules/{moduleId}/materials:
  parameters:
  - $ref: ../components/parameters.yaml#/InstitutionSlug
  - $ref: ../components/parameters.yaml#/ModuleId
  get:
    tags:
    - Materials
    operationId: listModuleMaterials
    summary: Listar materiales visibles de un módulo
    description: Teacher activo de cualquier sección ve borradores y escribe contenido
      compartido. Assistant/student solo leen publicado; material exige padre e ítem
      publicados. Admin/superadmin sin Enrollment no accede. Mutaciones y auditoría
      atómicas; no-op sin evento. JSON inerte; sin HTML ni binarios. Validación después
      de scope visible. Publish/unpublish sin body. Límite HTTP heredado 4096 bytes.
    responses:
      '200':
        description: Materiales visibles.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/materials.yaml#/MaterialListResponse
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
          X-Content-Type-Options:
            schema:
              type: string
              const: nosniff
      '400':
        $ref: ../components/responses.yaml#/ContentProblem
      '401':
        $ref: ../components/responses.yaml#/ContentUnauthorized
      '404':
        $ref: ../components/responses.yaml#/ContentProblem
      '500':
        $ref: ../components/responses.yaml#/ContentProblem
      '503':
        $ref: ../components/responses.yaml#/ContentProblem
  post:
    tags:
    - Materials
    operationId: createMarkdownMaterial
    summary: Crear material markdown
    description: Teacher activo de cualquier sección ve borradores y escribe contenido
      compartido. Assistant/student solo leen publicado; material exige padre e ítem
      publicados. Admin/superadmin sin Enrollment no accede. Mutaciones y auditoría
      atómicas; no-op sin evento. JSON inerte; sin HTML ni binarios. Validación después
      de scope visible. Publish/unpublish sin body. Límite HTTP heredado 4096 bytes.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/materials.yaml#/MarkdownMaterialCreate
    responses:
      '201':
        description: Material markdown creado en estado no publicado.
        headers:
          Location:
            description: URI del material creado.
            schema:
              type: string
              format: uri-reference
          Cache-Control:
            schema:
              type: string
              const: no-store
          X-Content-Type-Options:
            schema:
              type: string
              const: nosniff
        content:
          application/json:
            schema:
              $ref: ../components/schemas/materials.yaml#/MarkdownMaterial
      '400':
        $ref: ../components/responses.yaml#/ContentProblem
      '401':
        $ref: ../components/responses.yaml#/ContentUnauthorized
      '403':
        $ref: ../components/responses.yaml#/ContentProblem
      '404':
        $ref: ../components/responses.yaml#/ContentProblem
      '422':
        $ref: ../components/responses.yaml#/ContentProblem
      '500':
        $ref: ../components/responses.yaml#/ContentProblem
      '503':
        $ref: ../components/responses.yaml#/ContentProblem
      '413':
        $ref: ../components/responses.yaml#/ContentProblem
      '409':
        $ref: ../components/responses.yaml#/ContentProblem
      '415':
        $ref: ../components/responses.yaml#/ContentProblem
