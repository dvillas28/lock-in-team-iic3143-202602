/api/v1/institution/{institutionSlug}/courses/{courseId}/audit-events:
  parameters:
  - $ref: ../components/parameters.yaml#/InstitutionSlug
  - $ref: ../components/parameters.yaml#/CourseId
  get:
    tags:
    - Audit
    operationId: listCourseAuditEvents
    x-permissions: "Membership activa; owner admin conserva administrativos; grade exige teacher activo. Teacher ordinario limitado a sus secciones históricas."
    summary: Consultar historial de auditoría del curso
    description: Owner admin sin teacher conserva eventos distintos de grade. Owner admin
      con teacher activo en el curso ve todas sus secciones, incluido sectionId=null.
      Teacher ordinario solo ve eventos de sus secciones docentes históricas.
      Student, assistant y superadmin no obtienen auditoría por esos roles o flags.
      Eventos institucionales excluidos. Historia inmutable y snapshots sanitizados.
      Autorización antes de ORDER/LIMIT; filtros y continuación describen solo filas
      visibles. ResourceType grade sin docencia devuelve colección vacía autorizada.
      Cada petición y cursor revalidan permisos; publicar no concede auditoría estudiantil.
    parameters:
    - name: action
      in: query
      required: false
      schema:
        type: string
        maxLength: 64
    - name: resourceType
      in: query
      required: false
      schema:
        type: string
        maxLength: 32
    - name: resourceId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    - name: actorUserId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters.yaml#/SectionIdFilter
    - name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    - name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    - $ref: ../components/parameters.yaml#/Cursor
    - $ref: ../components/parameters.yaml#/Limit
    responses:
      '200':
        description: Eventos de auditoría filtrados y paginados.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/audit.yaml#/AuditEventListResponse
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '500':
        $ref: ../components/responses.yaml#/InternalError
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
