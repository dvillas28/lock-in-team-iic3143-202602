/api/v1/institutions/{institutionSlug}/courses/{courseId}/audit-events:
  parameters:
  - $ref: ../components/parameters.yaml#/InstitutionSlug
  - $ref: ../components/parameters.yaml#/CourseId
  get:
    tags:
    - Audit
    operationId: listCourseAuditEvents
    summary: Consultar historial de auditoría del curso
    description: Admin dueño ve todos los eventos del curso, incluidos sectionId=null,
      aunque también sea teacher. Solo en ausencia de ese permiso aplica scope de
      secciones teacher activas. Eventos institucionales excluidos. Inmutable y sanitizado.
      Admin dueño conserva acceso sin teacher; assistant/student no acceden. Se filtran también
      snapshots históricos al leer; pesos globales solo owner y publicaciones con sección histórica.
    parameters:
    - name: action
      in: query
      required: false
      schema:
        type: string
        maxLength: 64
    - name: resourceType
      in: query
      required: false
      schema:
        type: string
        maxLength: 32
    - name: resourceId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    - name: actorUserId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters.yaml#/SectionIdFilter
    - name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    - name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    - $ref: ../components/parameters.yaml#/Cursor
    - $ref: ../components/parameters.yaml#/Limit
    responses:
      '200':
        description: Eventos de auditoría filtrados y paginados.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/audit.yaml#/AuditEventListResponse
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '500':
        $ref: ../components/responses.yaml#/InternalError
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
