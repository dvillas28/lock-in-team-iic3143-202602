/api/v1/institution/{institutionSlug}/courses/{courseId}/quizzes:
  parameters:
    - $ref: '../components/parameters.yaml#/InstitutionSlug'
    - $ref: '../components/parameters.yaml#/CourseId'
  get:
    tags:
      - Quizzes
    operationId: listCourseQuizzes
    summary: Listar quizzes visibles del curso
    description: |
      Student/assistant ven publicados globales y de sus secciones activas. Teacher ve drafts de sus secciones; teacher con is_admin y ownership amplía alcance al curso completo. Las vistas de lista/detalle siempre excluyen pauta.
    parameters:
      - $ref: '../components/parameters.yaml#/SectionIdFilter'
    responses:
      '200':
        description: Quizzes visibles sin pautas de respuesta.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/quizzes.yaml#/QuizListResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '415':
        $ref: '../components/responses.yaml#/UnsupportedMediaType'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'
  post:
    tags:
      - Quizzes
    operationId: createQuiz
    summary: Crear un quiz en estado draft
    description: |
      Teacher activo es obligatorio para autoría/pauta. is_admin más ownership amplía destinatarios; teacher ordinario conserva sus secciones. Admin o superadmin por sí solos no conceden docencia.
      Assistants y students no pueden crear quizzes.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/quizzes.yaml#/QuizCreate'
    responses:
      '201':
        description: Quiz creado en estado draft.
        headers:
          Location:
            description: URI del quiz creado.
            schema:
              type: string
              format: uri-reference
        content:
          application/json:
            schema:
              $ref: '../components/schemas/quizzes.yaml#/QuizAuthoringView'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '415':
        $ref: '../components/responses.yaml#/UnsupportedMediaType'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'

/api/v1/institution/{institutionSlug}/quizzes/{quizId}:
  parameters:
    - $ref: '../components/parameters.yaml#/InstitutionSlug'
    - $ref: '../components/parameters.yaml#/QuizId'
  get:
    tags:
      - Quizzes
    operationId: getQuiz
    summary: Consultar la vista segura de un quiz
    description: Esta representación nunca contiene `isCorrect` ni otra pauta de respuestas.
    responses:
      '200':
        description: Quiz visible sin pauta.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/quizzes.yaml#/QuizStudentView'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
