/api/v1/institution/{institutionSlug}/quizzes/{quizId}/publish:
  parameters:
    - $ref: '../components/parameters.yaml#/InstitutionSlug'
    - $ref: '../components/parameters.yaml#/QuizId'
  post:
    tags:
      - Quizzes
    operationId: publishQuiz
    summary: Publicar un quiz válido
    description: |
      Valida fechas, puntajes, preguntas, al menos dos alternativas con IDs únicos
      y exactamente una alternativa correcta por pregunta. Genera auditoría. Teacher puede publicar quizzes dentro de su alcance académico. La operación
      asegura que exista un único GradeItem vinculado al quiz; se rechaza
      si ya se publicó alguna nota del curso y el quiz aún era draft. Repetir uno ya publicado devuelve 200 sin nuevo ítem, timestamp ni evento, incluso con el curso congelado. Peso inicial del ítem: 0; sin pauta en auditoría.
    responses:
      '200':
        description: Quiz publicado e inmutable para cambios incompatibles.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/quizzes.yaml#/QuizAuthoringView'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '415':
        $ref: '../components/responses.yaml#/UnsupportedMediaType'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'

/api/v1/institution/{institutionSlug}/sections/{sectionId}/quizzes/{quizId}/attempts:
  parameters:
    - $ref: '../components/parameters.yaml#/InstitutionSlug'
    - $ref: '../components/parameters.yaml#/SectionId'
    - $ref: '../components/parameters.yaml#/QuizId'
  post:
    tags:
      - Attempts
    operationId: startQuizAttempt
    summary: Iniciar un intento como estudiante autenticado
    description: |
      `studentId` se deriva del claim `sub`. Valida membership student activa,
      relación sección-curso, disponibilidad del quiz, máximo de intentos si existe
      y ausencia de nota publicada. Solo hay un intento activo por estudiante y
      quiz; sin máximo, los intentos son ilimitados. El `sectionId` queda como
      snapshot histórico inmutable y `attemptNumber` ordena los intentos.
      `closesAt` limita la disponibilidad del quiz, pero no cancela por sí solo
      un intento ya iniciado. Los intentos cancelados cuentan entre los iniciados.
      Si el usuario puede consultar la pauta de ese quiz como teacher, no puede rendirlo aunque también tenga rol student.
      Ventana [opensAt, closesAt), límites null ilimitados, reloj DB después de locks.
      Repetir clave/destino retorna la representación original de creación aun tras
      cierre/cancelación/publicación; revalida permisos. Otro destino da 409.
      Clave de 1..200 caracteres sin controles ni headers duplicados; scope tenant/actor/start.
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '201':
        description: Intento iniciado.
        headers:
          Location:
            description: URI del intento creado.
            schema:
              type: string
              format: uri-reference
        content:
          application/json:
            schema:
              $ref: '../components/schemas/quizzes.yaml#/QuizAttemptStudentView'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '415':
        $ref: '../components/responses.yaml#/UnsupportedMediaType'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'

/api/v1/institution/{institutionSlug}/quiz-attempts/{attemptId}:
  parameters:
    - $ref: '../components/parameters.yaml#/InstitutionSlug'
    - $ref: '../components/parameters.yaml#/AttemptId'
  get:
    tags:
      - Attempts
    operationId: getQuizAttempt
    summary: Consultar un intento autorizado
    description: |
      El estudiante solo puede consultar su intento y recibe la vista estudiantil,
      sin pauta ni corrección. Teacher y staff de la sección pueden recibir la
      vista docente con corrección o assistant sin isCorrect/pointsAwarded según permisos
      vigentes sobre la sección histórica. Admin/superadmin no sustituye teacher.
      anyOf permite solapamiento entre las vistas académicas sin corrección.
    responses:
      '200':
        description: Vista del intento apropiada para el rol autenticado.
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '../components/schemas/quizzes.yaml#/QuizAttemptStudentView'
                - $ref: '../components/schemas/quizzes.yaml#/QuizAttemptAcademicView'
                - $ref: '../components/schemas/quizzes.yaml#/QuizAttemptAssistantView'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '415':
        $ref: '../components/responses.yaml#/UnsupportedMediaType'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

/api/v1/institution/{institutionSlug}/quiz-attempts/{attemptId}/answers:
  parameters:
    - $ref: '../components/parameters.yaml#/InstitutionSlug'
    - $ref: '../components/parameters.yaml#/AttemptId'
  put:
    tags:
      - Attempts
    operationId: saveQuizAttemptAnswers
    summary: Reemplazar respuestas de un intento en progreso
    description: |
      En cada guardado, el servidor revalida la autorización vigente; no utiliza
      un snapshot de permisos tomado al iniciar el intento. El usuario autenticado
      debe ser el propietario del intento, mantener una membership `student` activa
      en el curso correspondiente y no tener acceso actual de autoría ni a la pauta
      de respuestas del quiz. Identidad inválida/inactiva produce 401;
      institución, membership o recurso no visible produce 404; una acción prohibida
      sobre un recurso visible produce 403. El request no acepta `studentId`,
      `isCorrect`, `pointsAwarded`, `scorePercent` ni `grade`. Si el intento ya
      fue enviado, calificado o cancelado, no se guardan respuestas y responde
      409 Conflict. Ventana [opensAt, closesAt), con límites null ilimitados y reloj DB
      posterior a locks; fuera de ventana da 409 sin cancelar. PUT reemplaza todo;
      answers [] borra respuestas; preguntas/alternativas ajenas dan 422.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/quizzes.yaml#/SaveQuizAttemptAnswersRequest'
    responses:
      '200':
        description: Respuestas guardadas sin información de corrección.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/quizzes.yaml#/QuizAttemptStudentView'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '415':
        $ref: '../components/responses.yaml#/UnsupportedMediaType'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'

/api/v1/institution/{institutionSlug}/quiz-attempts/{attemptId}/submit:
  parameters:
    - $ref: '../components/parameters.yaml#/InstitutionSlug'
    - $ref: '../components/parameters.yaml#/AttemptId'
  post:
    tags:
      - Attempts
    operationId: submitQuizAttempt
    summary: Enviar y calificar un intento de forma atómica
    description: |
      En cada envío, el servidor revalida la autorización vigente; no utiliza un
      snapshot de permisos tomado al iniciar el intento. El usuario autenticado
      debe ser el propietario del intento, mantener una membership `student` activa
      en el curso correspondiente y no tener acceso actual de autoría ni a la pauta
      de respuestas del quiz. Identidad inválida/inactiva produce 401;
      institución, membership o recurso no visible produce 404; una acción prohibida
      sobre un recurso visible produce 403. El servidor inmoviliza respuestas,
      calcula score y nota, y crea o actualiza el registro académico desde el último
      intento calificado por `attemptNumber` en una sola transacción. Una nota ya
      publicada bloquea nuevos envíos. Repetir la misma clave no duplica resultados;
      un submit incompatible o sobre un intento cancelado devuelve 409. La
      respuesta no revela la nota antes de publicarla. Recibo exacto id/status/submittedAt.
      Solo la clave original permite replay de graded; otra clave da 409 sin reservar
      alias. Una clave ligada a otro intento da 409. Scope tenant/actor/submit,
      separado de start. Revalidar permisos incluso tras cierre/publicación;
      replay original no exige ventana ni recalcula ni agrega eventos.
      Primer envío exige [opensAt, closesAt), límites null ilimitados y reloj DB
      después de locks. Fuera de ventana da 409 sin cancelar. Porcentaje NUMERIC
      HALF_UP a dos decimales; nota HALF_UP a uno usando ese porcentaje, escala
      1+porcentaje*3/60 hasta 60; sobre 60, 4+(porcentaje-60)*3/40.
      Omisiones/errores aportan cero. submitted nunca queda pendiente al commit.
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: Intento enviado, o resultado idempotente de un submit ya procesado.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/quizzes.yaml#/QuizAttemptSubmissionReceipt'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '415':
        $ref: '../components/responses.yaml#/UnsupportedMediaType'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'

/api/v1/institution/{institutionSlug}/quiz-attempts/{attemptId}/cancel:
  parameters:
    - $ref: '../components/parameters.yaml#/InstitutionSlug'
    - $ref: '../components/parameters.yaml#/AttemptId'
  post:
    tags:
      - Attempts
    operationId: cancelQuizAttempt
    summary: Cancelar un intento en progreso
    description: |
      El estudiante propietario puede cancelar su intento solo si mantiene una
      membership `student` activa en el curso y no tiene acceso actual de autoría
      ni a la pauta del quiz. Teacher activo más is_admin y ownership del curso o
      teacher con Enrollment activo en la sección histórica del intento también
      pueden cancelarlo para resolver un intento abandonado. El servidor revalida
      estos permisos al cancelar: identidad inválida/inactiva produce 401;
      institución, membership o recurso no visible produce 404; una acción prohibida
      sobre un recurso visible produce 403.
      Solo un intento `inProgress` pasa atómicamente a `cancelled`, registra
      `cancelledAt` y genera auditoría con el actor, sin calcular nota ni modificar
      una nota existente. `cancelled` es terminal: deja de bloquear la publicación,
      pero conserva `attemptNumber` y cuenta para `maxAttempts` como intento
      iniciado. Repetir la cancelación de un intento ya cancelado devuelve 204
      sin duplicar la auditoría. Un intento `submitted` o `graded` produce 409
      Conflict. La cancelación no modifica ni reabre una nota ya publicada.
      No exige ventana abierta; teacher autorizado puede cancelar aunque el estudiante esté revocado.
    responses:
      '204':
        description: Intento cancelado, o cancelación ya aplicada.
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '415':
        $ref: '../components/responses.yaml#/UnsupportedMediaType'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'

/api/v1/institution/{institutionSlug}/quizzes/{quizId}/attempts:
  parameters:
    - $ref: '../components/parameters.yaml#/InstitutionSlug'
    - $ref: '../components/parameters.yaml#/QuizId'
  get:
    tags:
      - Attempts
    operationId: listQuizAttempts
    summary: Listar intentos para revisión académica
    description: |
      Teacher con is_admin y ownership puede consultar todo su curso. Teacher
      ordinario y assistant solo secciones con Enrollment activo propio. Students no tienen acceso.
      Cada fila usa vista académica o assistant según permiso de pauta en su sección histórica;
      assistant nunca recibe isCorrect/pointsAwarded. Cursor ligado a actor, tenant, quiz y filtros;
      cada página revalida permisos. Destinatarios revocados conservan historia.
    parameters:
      - $ref: '../components/parameters.yaml#/SectionIdFilter'
      - $ref: '../components/parameters.yaml#/StudentIdFilter'
      - name: status
        in: query
        required: false
        schema:
          $ref: '../components/schemas/quizzes.yaml#/QuizAttemptStatus'
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: Intentos autorizados.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/quizzes.yaml#/QuizAttemptListResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
