/api/v1/quizzes/{quizId}/questions/{questionId}:
  parameters:
    - $ref: '../components/parameters.yaml#/TenantHeader'
    - $ref: '../components/parameters.yaml#/QuizId'
    - $ref: '../components/parameters.yaml#/QuestionId'
  patch:
    tags:
      - Quizzes
    operationId: updateQuizQuestion
    summary: Actualizar una pregunta de un quiz draft
    description: Requiere coordinator o teacher autorizado para la sección del quiz.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/quizzes.yaml#/QuestionUpdate'
    responses:
      '200':
        description: Pregunta actualizada.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/quizzes.yaml#/QuestionAuthoringView'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
