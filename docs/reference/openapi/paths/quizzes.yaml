/api/v1/courses/{courseId}/quizzes:
  parameters:
    - $ref: '../components/parameters.yaml#/TenantHeader'
    - $ref: '../components/parameters.yaml#/CourseId'
  get:
    tags:
      - Quizzes
    operationId: listCourseQuizzes
    summary: Listar quizzes visibles del curso
    description: |
      Estudiantes ven quizzes publicados aplicables a su sección. Teachers y
      assistants quedan restringidos a sus secciones; coordinators ven el curso completo.
    parameters:
      - $ref: '../components/parameters.yaml#/SectionIdFilter'
    responses:
      '200':
        description: Quizzes visibles sin pautas de respuesta.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/quizzes.yaml#/QuizListResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
  post:
    tags:
      - Quizzes
    operationId: createQuiz
    summary: Crear un quiz en estado draft
    description: |
      Coordinators pueden crear quizzes de curso o sección. Teachers pueden crear
      únicamente quizzes asociados a una sección donde tengan rol `teacher`.
      Assistants y students no pueden crear quizzes.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/quizzes.yaml#/QuizCreate'
    responses:
      '201':
        description: Quiz creado en estado draft.
        headers:
          Location:
            description: URI del quiz creado.
            schema:
              type: string
              format: uri-reference
        content:
          application/json:
            schema:
              $ref: '../components/schemas/quizzes.yaml#/QuizAuthoringView'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'

/api/v1/quizzes/{quizId}:
  parameters:
    - $ref: '../components/parameters.yaml#/TenantHeader'
    - $ref: '../components/parameters.yaml#/QuizId'
  get:
    tags:
      - Quizzes
    operationId: getQuiz
    summary: Consultar la vista segura de un quiz
    description: Esta representación nunca contiene `isCorrect` ni otra pauta de respuestas.
    responses:
      '200':
        description: Quiz visible sin pauta.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/quizzes.yaml#/QuizStudentView'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
  patch:
    tags:
      - Quizzes
    operationId: updateQuiz
    summary: Actualizar un quiz editable
    description: |
      Solo se admite en estado draft. Coordinator puede modificar cualquier quiz
      del curso; teacher únicamente quizzes de sus secciones. Un quiz publicado
      o utilizado produce 409 Conflict.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/quizzes.yaml#/QuizUpdate'
    responses:
      '200':
        description: Quiz actualizado.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/quizzes.yaml#/QuizAuthoringView'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'

/api/v1/quizzes/{quizId}/authoring:
  parameters:
    - $ref: '../components/parameters.yaml#/TenantHeader'
    - $ref: '../components/parameters.yaml#/QuizId'
  get:
    tags:
      - Quizzes
    operationId: getQuizAuthoringView
    summary: Consultar quiz con pauta de autoría
    description: |
      Coordinator puede consultar cualquier sección. Teacher puede consultar sus
      secciones. Assistants y students no acceden a la vista de autoría; para
      revisión de intentos existe una representación académica separada.
    responses:
      '200':
        description: Quiz y pauta autorizada.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/quizzes.yaml#/QuizAuthoringView'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

