      o utilizado produce 409 Conflict. sectionId puede reasignarse dentro del mismo curso/institución con permiso vigente sobre origen y destino; omitir conserva, null amplía al curso. Quiz.id y Section.id son inmutables.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/quizzes.yaml#/QuizUpdate'
    responses:
      '200':
        description: Quiz actualizado.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/quizzes.yaml#/QuizAuthoringView'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '415':
        $ref: '../components/responses.yaml#/UnsupportedMediaType'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'

