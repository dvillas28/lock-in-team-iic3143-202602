        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/UnprocessableEntity
      '500':
        $ref: ../components/responses.yaml#/InternalError
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
/api/v1/institutions/{institutionSlug}/sections/{sectionId}/enrollments:
  parameters:
  - $ref: ../components/parameters.yaml#/InstitutionSlug
  - $ref: ../components/parameters.yaml#/SectionId
  get:
    tags:
    - Enrollments
    operationId: listSectionEnrollments
    summary: Listar memberships de una sección autorizada
    description: Admin dueño o teacher/assistant activo de esta sección; student no
      lista participantes.
    parameters:
    - $ref: ../components/parameters.yaml#/Cursor
    - $ref: ../components/parameters.yaml#/Limit
    responses:
      '200':
        description: Memberships de la sección.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/sections.yaml#/EnrollmentListResponse
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '500':
        $ref: ../components/responses.yaml#/InternalError
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
  post:
    tags:
    - Enrollments
    operationId: createSectionEnrollment
    summary: Crear una membership de sección
    description: Admin dueño o teacher activo de esta sección. Miembro destinatario
      provisionado y activo; roles múltiples distintos, historial preservado. Sin
      privilegios desde JWT o body.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/sections.yaml#/EnrollmentCreate
    responses:
      '201':
        description: Membership creada.
        headers:
          Location:
            description: URI de la membership creada.
            schema:
              type: string
              format: uri-reference
          Cache-Control:
            schema:
              type: string
              const: no-store
        content: &id001
          application/json:
            schema:
              $ref: ../components/schemas/sections.yaml#/Enrollment
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/UnprocessableEntity
      '200':
        description: Rol ya activo; mismo ID, sin nuevo evento.
        content: *id001
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
      '500':
        $ref: ../components/responses.yaml#/InternalError
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
/api/v1/institutions/{institutionSlug}/sections/{sectionId}/enrollments/{enrollmentId}:
  parameters:
  - $ref: ../components/parameters.yaml#/InstitutionSlug
  - $ref: ../components/parameters.yaml#/SectionId
  - $ref: ../components/parameters.yaml#/EnrollmentId
  patch:
    tags:
    - Enrollments
    operationId: updateSectionEnrollment
    summary: Cambiar rol o desactivar una membership
    description: Admin dueño o teacher activo de esta sección. Miembro destinatario
      provisionado y activo; roles múltiples distintos, historial preservado. Sin
      privilegios desde JWT o body. Exactamente role o active. Cambio de rol devuelve
      sucesor (ID puede cambiar). Último teacher se puede revocar; el curso permanece.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/sections.yaml#/EnrollmentUpdate
    responses:
      '200':
        description: Membership actualizada.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/sections.yaml#/Enrollment
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/UnprocessableEntity
      '500':
        $ref: ../components/responses.yaml#/InternalError
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
/api/v1/institutions/{institutionSlug}/courses/{courseId}/modules:
  parameters:
  - $ref: ../components/parameters.yaml#/InstitutionSlug
  - $ref: ../components/parameters.yaml#/CourseId
  get:
    tags:
    - Modules
    operationId: listCourseModules
    summary: Listar módulos visibles del curso
    description: Estudiantes reciben solo módulos publicados; el staff autorizado
      puede ver borradores.
    responses:
      '200':
        description: Módulos visibles en orden.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/courses.yaml#/ModuleListResponse
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '404':
        $ref: ../components/responses.yaml#/NotFound
  post:
    tags:
    - Modules
    operationId: createCourseModule
    summary: Crear un módulo del curso
    description: Requiere rol `teacher`, porque el módulo tiene alcance de curso.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/courses.yaml#/ModuleCreate
    responses:
      '201':
        description: Módulo creado.
        headers:
          Location:
            description: URI del módulo creado.
            schema:
              type: string
              format: uri-reference
        content:
          application/json:
            schema:
              $ref: ../components/schemas/courses.yaml#/CourseModule
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/UnprocessableEntity
