/api/v1/institutions/{institutionSlug}/courses/{courseId}/sections:
  parameters:
  - $ref: ../components/parameters.yaml#/InstitutionSlug
  - $ref: ../components/parameters.yaml#/CourseId
  get:
    tags:
    - Sections
    operationId: listSections
    summary: Listar secciones visibles del curso
    description: Admin dueño ve todas; resto solo secciones con Enrollment activo
      propio.
    responses:
      '200':
        description: Secciones visibles.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/sections.yaml#/SectionListResponse
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '500':
        $ref: ../components/responses.yaml#/InternalError
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
  post:
    tags:
    - Sections
    operationId: createSection
    summary: Crear una sección del curso
    description: Exige is_admin institucional vigente y dueño del curso. Teacher sin
      admin no configura secciones.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/sections.yaml#/SectionCreate
    responses:
      '201':
        description: Sección creada.
        headers:
          Location:
            description: URI de la sección creada.
            schema:
              type: string
              format: uri-reference
          Cache-Control:
            schema:
              type: string
              const: no-store
        content:
          application/json:
            schema:
              $ref: ../components/schemas/sections.yaml#/Section
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/UnprocessableEntity
      '500':
        $ref: ../components/responses.yaml#/InternalError
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
