    $ref: ../components/parameters.yaml#/InstitutionSlug
  get:
    tags:
    - Accounts
    operationId: listAccountInvitations
    summary: Listar invitaciones institucionales
    x-permissions: User, institución y pertenencia activos; isAdmin OR isSuperAdmin vigente del tenant. No concede
      roles académicos.
    description: Identidad global propia o contexto institucional explícito; respuesta sin secretos y Cache-Control
      no-store.
    responses:
      '200':
        description: Operación completada.
        headers: *id001
        content:
          application/json:
            schema:
              $ref: ../components/schemas/accounts.yaml#/InvitationList
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
      '500':
        $ref: ../components/responses.yaml#/InternalError
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
    parameters:
    - $ref: ../components/parameters.yaml#/Cursor
    - $ref: ../components/parameters.yaml#/Limit
  post:
    tags:
    - Accounts
    operationId: createAccountInvitation
    summary: Crear invitación sin crear cuenta todavía
    x-permissions: User, institución y pertenencia activos; isAdmin OR isSuperAdmin vigente del tenant. No concede
      roles académicos.
    description: Idempotency-Key obligatorio. Misma clave/cuerpo recupera resultado; cambio de cuerpo da 409. No
      revela cuentas de otras instituciones ni crea User/membership antes de activación.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/accounts.yaml#/InvitationCreate
    responses:
      '201':
        description: Operación completada.
        headers: *id001
        content:
          application/json:
            schema:
              $ref: ../components/schemas/accounts.yaml#/AccountInvitation
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
      '500':
        $ref: ../components/responses.yaml#/InternalError
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
    parameters:
    - &id003
      $ref: ../components/parameters.yaml#/IdempotencyKey
/api/v1/institution/{institutionSlug}/invitations/{invitationId}/send:
  parameters:
  - *id002
