/api/v1/auth/invitations/activate:
  post:
    tags:
    - Accounts
    operationId: activateAccountInvitation
    summary: Activar cuenta nueva mediante código de invitación
    x-permissions: Código vigente de un uso; institución/emisor autorizados. Cuenta existente exige login del titular.
    description: Solo POST consume el código y crea identidad/pertenencia sin flags ni matrículas. Cuenta existente
      devuelve 409 INVITATION_LOGIN_REQUIRED. GET del enlace no activa. Sin login automático.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
