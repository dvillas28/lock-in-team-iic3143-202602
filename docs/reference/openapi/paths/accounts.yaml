    tags:
    - Accounts
    operationId: sendAccountInvitation
    summary: Enviar invitación pendiente
    x-permissions: User, institución y pertenencia activos; isAdmin OR isSuperAdmin vigente del tenant. No concede
      roles académicos.
    description: 'Red fuera de transacción. Sin correo configurado: 503 INTEGRATION_NOT_CONFIGURED, sin emitir ni
      rotar código. accepted significa aceptación por proveedor, no entrega ni activación. Reenvío explícito separado
      60 s; respuestas inciertas requieren rotación confirmada.'
    responses:
      '200':
        description: Operación completada.
        headers: *id001
        content:
          application/json:
            schema:
              $ref: ../components/schemas/accounts.yaml#/AccountInvitation
      '400':
        $ref: ../components/responses.yaml#/BadRequest
