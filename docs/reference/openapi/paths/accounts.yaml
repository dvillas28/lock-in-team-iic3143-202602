/api/v1/me:
  get:
    tags:
    - Accounts
    operationId: getOwnProfile
    summary: Consultar perfil global propio
    x-permissions: User activo autenticado; cuenta global propia, sin requerir pertenencia institucional.
    description: Identidad global propia o contexto institucional explícito; respuesta sin secretos y Cache-Control
      no-store.
    responses:
      '200':
        description: Operación completada.
        headers: &id001
          Cache-Control:
            schema:
              type: string
              const: no-store
          X-Content-Type-Options:
            schema:
              type: string
              const: nosniff
        content:
          application/json:
            schema:
              $ref: ../components/schemas/accounts.yaml#/OwnProfile
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
      '500':
        $ref: ../components/responses.yaml#/InternalError
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
  patch:
    tags:
    - Accounts
    operationId: updateOwnProfile
    summary: Editar nombre y descripción propios
    x-permissions: User activo autenticado; cuenta global propia, sin requerir pertenencia institucional.
    description: Exige expectedUpdatedAt exacto; edición obsoleta devuelve 409. Correo, roles, flags y estado no
      son editables.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/accounts.yaml#/ProfileUpdate
    responses:
      '200':
        description: Operación completada.
        headers: *id001
        content:
          application/json:
            schema:
              $ref: ../components/schemas/accounts.yaml#/OwnProfile
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
      '500':
        $ref: ../components/responses.yaml#/InternalError
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
/api/v1/me/password:
  post:
    tags:
    - Accounts
    operationId: changeOwnPassword
    summary: Cambiar contraseña e invalidar sesiones anteriores
    x-permissions: User activo autenticado; cuenta global propia, sin requerir pertenencia institucional.
    description: Contraseña actual incorrecta devuelve 400. Hash, versión y auditoría son atómicos. Éxito exige
      nuevo login en todas las sesiones.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/accounts.yaml#/PasswordChange
    responses:
      '204':
        description: Operación completada.
        headers: *id001
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
      '500':
        $ref: ../components/responses.yaml#/InternalError
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
/api/v1/me/avatar:
  get:
    tags:
    - Accounts
    operationId: getOwnAvatar
    summary: Consultar foto privada propia
    x-permissions: User activo autenticado; cuenta global propia, sin requerir pertenencia institucional.
    description: Identidad global propia o contexto institucional explícito; respuesta sin secretos y Cache-Control
      no-store.
    responses:
      '200':
        description: Foto normalizada del titular.
        headers: *id001
        content:
          image/webp:
            schema:
              type: string
              format: binary
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
      '500':
        $ref: ../components/responses.yaml#/InternalError
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
