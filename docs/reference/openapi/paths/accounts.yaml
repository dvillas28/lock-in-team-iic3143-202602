    tags:
    - Accounts
    operationId: putOwnAvatar
    summary: Subir o reemplazar foto propia
    x-permissions: User activo autenticado; cuenta global propia, sin requerir pertenencia institucional.
    description: Límite de archivo 2 MiB y entrada 16 MP; normaliza WebP 1024×1024. Fallos conservan referencia
      previa. Integración deshabilitada devuelve 503 sin modificar datos.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: ../components/schemas/accounts.yaml#/AvatarUpload
    responses:
      '200':
        description: Operación completada.
        headers: *id001
        content:
          application/json:
            schema:
              $ref: ../components/schemas/accounts.yaml#/OwnProfile
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
      '500':
        $ref: ../components/responses.yaml#/InternalError
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
  delete:
    tags:
    - Accounts
    operationId: deleteOwnAvatar
    summary: Eliminar foto propia
    x-permissions: User activo autenticado; cuenta global propia, sin requerir pertenencia institucional.
    description: Identidad global propia o contexto institucional explícito; respuesta sin secretos y Cache-Control
      no-store.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/accounts.yaml#/AvatarDelete
    responses:
      '200':
        description: Operación completada.
        headers: *id001
        content:
          application/json:
            schema:
              $ref: ../components/schemas/accounts.yaml#/OwnProfile
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
      '500':
        $ref: ../components/responses.yaml#/InternalError
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
