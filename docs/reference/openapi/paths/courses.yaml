/api/v1/institutions/{institutionSlug}/courses:
  parameters:
  - $ref: ../components/parameters.yaml#/InstitutionSlug
  get:
    tags:
    - Courses
    operationId: listCourses
    x-permissions: "Membership activa; lista solo cursos con Enrollment activo propio o isAdmin vigente y createdBy=actor."
    summary: Listar cursos visibles para el usuario
    description: Admin dueño o Enrollment activo; privilegios institucionales vigentes,
      sin acceso a cursos ajenos.
    responses:
      '200':
        description: Cursos visibles dentro de la Institution seleccionada.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/courses.yaml#/CourseListResponse
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '500':
        $ref: ../components/responses.yaml#/InternalError
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
  post:
    tags:
    - Courses
    operationId: createCourse
    x-permissions: "Membership activa e isAdmin vigente; el actor queda como propietario inmutable y teacher inicial."
    summary: Crear curso propio, primera sección y teacher inicial
    description: Exige is_admin vigente. createdBy deriva del actor y es inmutable.
      Una transacción incluye curso, sección, teacher y eventos. Repetición code/term
      produce 409.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/courses.yaml#/CourseCreate
    responses:
      '201':
        description: Curso creado atómicamente.
        headers:
          Location:
            schema:
              type: string
              format: uri-reference
          Cache-Control:
            schema:
              type: string
              const: no-store
        content:
          application/json:
            schema:
              $ref: ../components/schemas/courses.yaml#/Course
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '500':
        $ref: ../components/responses.yaml#/InternalError
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/UnprocessableEntity
/api/v1/institutions/{institutionSlug}/courses/{courseId}:
  parameters:
  - $ref: ../components/parameters.yaml#/InstitutionSlug
  - $ref: ../components/parameters.yaml#/CourseId
  get:
    tags:
    - Courses
    operationId: getCourse
    x-permissions: "Membership activa y Enrollment activo en el curso o isAdmin vigente y createdBy=actor."
    summary: Consultar un curso visible
    responses:
      '200':
        description: Curso solicitado.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/courses.yaml#/Course
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '500':
        $ref: ../components/responses.yaml#/InternalError
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
  patch:
    tags:
    - Courses
    operationId: updateCourse
    x-permissions: "Membership activa, isAdmin vigente y createdBy=actor. Teacher por sí solo no configura el curso."
    summary: Actualizar configuración general del curso
    description: Exige is_admin institucional y createdBy igual al actor. Mismo estado
      es no-op sin evento.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/courses.yaml#/CourseUpdate
    responses:
      '200':
        description: Curso actualizado.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/courses.yaml#/Course
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '422':
        $ref: ../components/responses.yaml#/UnprocessableEntity
      '500':
        $ref: ../components/responses.yaml#/InternalError
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
      '409':
        $ref: ../components/responses.yaml#/Conflict
