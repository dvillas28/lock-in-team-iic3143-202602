/health:
  get:
    tags:
      - Platform
    operationId: getHealth
    summary: Consultar salud del servicio
    description: No consulta ni expone secretos o configuración interna sensible.
    security: []
    responses:
      '200':
        description: Servicio disponible.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/HealthResponse'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'

/api/v1/institutions:
  get:
    tags:
      - Institutions
    operationId: listAccessibleInstitutions
    summary: Listar instituciones accesibles para la identidad actual
    description: Devuelve únicamente las instituciones con una membership activa para el User autenticado.
    responses:
      '200':
        description: Instituciones accesibles.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/tenancy.yaml#/InstitutionListResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

/api/v1/institutions/{institutionSlug}/me:
  parameters:
    - $ref: '../components/parameters.yaml#/InstitutionSlug'
  get:
    tags:
      - Institutions
    operationId: getCurrentUser
    summary: Consultar identidad y memberships del contexto institucional
    responses:
      '200':
        description: Identidad autenticada y sus alcances dentro de la Institution seleccionada.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/tenancy.yaml#/CurrentUser'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

/api/v1/institutions/{institutionSlug}/users:
  parameters:
    - $ref: '../components/parameters.yaml#/InstitutionSlug'
  get:
    tags:
      - Enrollments
    operationId: searchInstitutionUsers
    summary: Buscar participantes existentes de la institución
    description: Reservado a coordinators para seleccionar usuarios al gestionar memberships académicas.
    parameters:
      - $ref: '../components/parameters.yaml#/Search'
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: Usuarios de la institución que coinciden con la búsqueda.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/tenancy.yaml#/UserListResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
