/ready:
  get:
    tags: [Platform]
    operationId: getReadiness
    summary: Confirmar disponibilidad de la persistencia
    description: >
      Público, sin datos institucionales ni credenciales. Responde en un máximo
      de cinco segundos. Comprueba tablas y columnas requeridas sin leer filas; no inspecciona
      tipos, defaults, índices ni constraints ni ejecuta migraciones o seed.
    security: []
    responses:
      '200':
        description: Proceso inicializado y persistencia mínima disponible.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ok]
      '503':
        description: Persistencia inaccesible o estructura mínima ausente.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [unavailable]

/health:
  get:
    tags:
      - Platform
    operationId: getHealth
    summary: Consultar salud del servicio
    description: No consulta ni expone secretos o configuración interna sensible.
    security: []
    responses:
      '200':
        description: Servicio disponible.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/HealthResponse'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'

/api/v1/institutions:
  get:
    tags:
      - Institutions
    operationId: listAccessibleInstitutions
    summary: Listar instituciones accesibles para la identidad actual
    description: User, membership e Institution deben estar activos. Orden por slug; sin pertenencias retorna items vacío.
    responses:
      '200':
        description: Instituciones accesibles.
        headers:
          Cache-Control:
            schema: {type: string, const: no-store}
        content:
          application/json:
            schema:
              $ref: '../components/schemas/tenancy.yaml#/InstitutionListResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/institutions/{institutionSlug}/me:
  parameters:
    - $ref: '../components/parameters.yaml#/InstitutionSlug'
  get:
    tags:
      - Institutions
    operationId: getCurrentUser
    summary: Consultar identidad y memberships del contexto institucional
    responses:
      '200':
        description: Identidad autenticada y sus alcances dentro de la Institution seleccionada.
        headers:
          Cache-Control:
            schema: {type: string, const: no-store}
        content:
          application/json:
            schema:
              $ref: '../components/schemas/tenancy.yaml#/CurrentUser'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/institutions/{institutionSlug}/users:
  parameters:
    - $ref: '../components/parameters.yaml#/InstitutionSlug'
  get:
    tags:
      - Enrollments
    operationId: searchInstitutionUsers
    summary: Buscar participantes existentes de la institución
    description: Reservado a teachers para seleccionar usuarios al gestionar memberships académicas.
    parameters:
      - $ref: '../components/parameters.yaml#/Search'
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: Usuarios de la institución que coinciden con la búsqueda.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/tenancy.yaml#/UserListResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
