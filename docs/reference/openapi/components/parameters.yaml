InstitutionSlug:
  name: institutionSlug
  in: path
  required: true
  description: |
    Slug de la Institution solicitada. Solo identifica contexto; el backend
    valida que la identidad tenga una InstitutionMembership activa.
  schema:
    type: string
    pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
  example: uc

Cursor:
  name: cursor
  in: query
  required: false
  description: Cursor opaco retornado por la página anterior.
  schema:
    type: string

Limit:
  name: limit
  in: query
  required: false
  description: Cantidad máxima de elementos a retornar.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20

IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: |
    Clave opaca elegida por el cliente para una operación sensible. Su scope
    incluye la Institution del path. Repetir la misma solicitud con igual clave
    y payload devuelve el primer resultado; reutilizarla con otro payload
    produce 409 Conflict.
  schema:
    type: string
    minLength: 1

