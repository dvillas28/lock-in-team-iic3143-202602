GradeValue:
  type: number
  minimum: 1
  maximum: 7
  multipleOf: 0.1
  description: |
    Nota chilena redondeada a un decimal con HALF_UP. Para `scorePercent <= 60`,
    `grade = 1 + scorePercent * 3 / 60`. Para `scorePercent > 60`,
    `grade = 4 + (scorePercent - 60) * 3 / 40`.
  example: 5.5

GradeItem:
  type: object
  additionalProperties: false
  required:
    - id
    - courseId
    - quizId
    - title
    - weightPercent
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    courseId:
      type: string
      format: uuid
      readOnly: true
    assignmentId:
      type: string
      format: uuid
      readOnly: true
    quizId:
      type: [string, 'null']
      format: uuid
      readOnly: true
    title:
      type: string
    weightPercent:
      type: number
      minimum: 0
      maximum: 100
      multipleOf: 0.01
    createdAt:
      type: string
      format: date-time
      readOnly: true

    groupId:
      type: string
      format: uuid
    maxPoints:
      type: number
      minimum: 0

GradeItemListResponse:
  type: object
  additionalProperties: false
  required:
    - items
    - totalWeightPercent
  properties:
    items:
      type: array
      items:
        $ref: '#/GradeItem'
    totalWeightPercent:
      type: number
      minimum: 0
    weightsLocked:
      type: boolean
      deprecated: true
      description: Campo de compatibilidad. Siempre false.
    hasPublishedGrades:
      type: boolean
    calculation:
      type: string
      enum: [legacy, points]
    version:
      type: integer
      minimum: 0
    groups:
      type: array
      items:
        $ref: './gradebook-groups.yaml#/GradeGroup'

GradeWeightInput:
  type: object
  additionalProperties: false
  required:
    - gradeItemId
    - weightPercent
  properties:
    gradeItemId:
      type: string
      format: uuid
    weightPercent:
      type: number
      minimum: 0
      maximum: 100
      multipleOf: 0.01

UpdateGradebookWeightsRequest:
  type: object
  additionalProperties: false
  required:
    - items
  properties:
    items:
      type: array
      minItems: 1
      items:
        $ref: '#/GradeWeightInput'
  description: La colección completa se valida y persiste atómicamente; debe sumar 100%.

GradebookWeightsResponse:
  type: object
  additionalProperties: false
  required:
    - items
    - totalWeightPercent
  properties:
    items:
      type: array
      items:
        $ref: '#/GradeItem'
    totalWeightPercent:
      type: number
      const: 100

GradeTeacherView:
  type: object
  additionalProperties: false
  required:
    - id
    - gradeItemId
    - studentId
    - sectionId
    - attemptId
    - scorePercent
    - grade
    - publishedAt
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    assignmentId: {type: string, format: uuid}
    gradeItemId:
      type: string
      format: uuid
      readOnly: true
    studentId:
      type: string
      format: uuid
      readOnly: true
    sectionId:
      type: string
      format: uuid
      readOnly: true
    attemptId:
      type: string
      format: uuid
      readOnly: true
    scorePercent:
      type: [number, 'null']
      minimum: 0
      maximum: 100
      readOnly: true
    grade:
      oneOf:
        - $ref: '#/GradeValue'
        - type: 'null'
    publishedAt:
      type: [string, 'null']
      format: date-time
      readOnly: true

    pointsEarned:
      type: number
      minimum: 0
    revisionId:
      type: [string, 'null']
      format: uuid
    revisedAt:
      type: [string, 'null']
      format: date-time

GradebookStudentRow:
  type: object
  additionalProperties: false
  required:
    - student
    - sectionId
    - grades
    - partialAverage
    - publishedWeightPercent
  properties:
    student:
      $ref: './tenancy.yaml#/UserSummary'
    sectionId:
      type: string
      format: uuid
    grades:
      type: array
      items:
        $ref: '#/GradeTeacherView'
    partialAverage:
      oneOf:
        - $ref: '#/GradeValue'
        - type: 'null'
      readOnly: true
    publishedWeightPercent:
      type: number
      minimum: 0
      maximum: 100
      readOnly: true

    groupResults:
      type: array
      items:
        $ref: './gradebook-groups.yaml#/GradeGroupResult'

GradebookResponse:
  unevaluatedProperties: false
  allOf:
    - $ref: './common.yaml#/PageInfo'
    - type: object
      required:
        - courseId
        - items
      properties:
        courseId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/GradebookStudentRow'

PublishGradesRequest:
  type: object
  additionalProperties: false
  required:
    - gradeItemIds
    - sectionIds
    - studentIds
  properties:
    gradeItemIds:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        format: uuid
    sectionIds:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        format: uuid

    studentIds:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        format: uuid

PublishGradesResponse:
  type: object
  additionalProperties: false
  required:
    - publishedCount
    - publishedAt
  properties:
    publishedCount:
      type: integer
      minimum: 1
    publishedAt:
      type: string
      format: date-time
      readOnly: true

PublishedGradeStudentView:
  type: object
  additionalProperties: false
  required:
    - gradeItemId
    - title
    - weightPercent
    - scorePercent
    - grade
    - publishedAt
  properties:
    assignmentId: {type: string, format: uuid}
    gradeItemId:
      type: string
      format: uuid
      readOnly: true
    title:
      type: string
    weightPercent:
      type: number
      minimum: 0
      maximum: 100
      multipleOf: 0.01
    scorePercent:
      type: [number, 'null']
      minimum: 0
      maximum: 100
      readOnly: true
    grade:
      oneOf:
        - $ref: '#/GradeValue'
        - type: 'null'
    publishedAt:
      type: string
      format: date-time
      readOnly: true

    groupId:
      type: string
      format: uuid
    groupTitle:
      type: string
    pointsEarned:
      type: number
      minimum: 0
    maxPoints:
      type: number
      minimum: 0
    revisedAt:
      type: [string, 'null']
      format: date-time

StudentGradesResponse:
  type: object
  additionalProperties: false
  required:
    - courseId
    - items
    - partialAverage
    - publishedWeightPercent
    - isPartial
  properties:
    courseId:
      type: string
      format: uuid
    items:
      type: array
      description: Contiene exclusivamente notas propias ya publicadas.
      items:
        $ref: '#/PublishedGradeStudentView'
    partialAverage:
      oneOf:
        - $ref: '#/GradeValue'
        - type: 'null'
      readOnly: true
      description: |
        En modo puntos, se aplica la escala chilena al porcentaje de grupos con resultados
        publicados, normalizado por la suma de sus pesos. En modo histórico se conserva
        el promedio ponderado de notas individuales. Devuelve null si el peso activo es cero.
    publishedWeightPercent:
      type: number
      minimum: 0
      maximum: 100
      readOnly: true
    isPartial:
      type: boolean
      readOnly: true
      description: En modo puntos representa un promedio en curso. En modo histórico indica peso activo menor al 100%.
    calculation:
      type: string
      enum: [legacy, points]
    groupResults:
      type: array
      items:
        $ref: './gradebook-groups.yaml#/GradeGroupResult'
