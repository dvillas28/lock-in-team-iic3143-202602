Section:
  type: object
  additionalProperties: false
  required:
  - id
  - courseId
  - code
  - capacity
  - createdAt
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    courseId:
      type: string
      format: uuid
      readOnly: true
    code:
      type: string
      minLength: 1
      maxLength: 32
    capacity:
      description: Null es ilimitada. Admite 0 solo en registros previos a la regla de mínimo 1.
      type:
      - integer
      - 'null'
      minimum: 0
      maximum: 2147483647
    createdAt:
      type: string
      format: date-time
      readOnly: true
SectionCreate:
  type: object
  additionalProperties: false
  required:
  - code
  properties:
    code:
      type: string
      minLength: 1
      maxLength: 32
    capacity:
      description: Entero positivo; null mantiene la capacidad ilimitada.
      type:
      - integer
      - 'null'
      minimum: 1
      maximum: 2147483647
SectionUpdate:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    code:
      type: string
      minLength: 1
      maxLength: 32
    capacity:
      description: Entero positivo; null mantiene la capacidad ilimitada.
      type:
      - integer
      - 'null'
      minimum: 1
      maximum: 2147483647
SectionListResponse:
  type: object
  additionalProperties: false
  required:
  - items
  properties:
    items:
      type: array
      items:
        $ref: '#/Section'
EnrollmentRole:
  type: string
  enum:
  - teacher
  - assistant
  - student
Enrollment:
  type: object
  additionalProperties: false
  required:
  - id
  - sectionId
  - user
  - role
  - active
  - createdAt
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    sectionId:
      type: string
      format: uuid
      readOnly: true
    user:
      $ref: ./tenancy.yaml#/UserSummary
    role:
      $ref: '#/EnrollmentRole'
    active:
      type: boolean
    createdAt:
      type: string
      format: date-time
      readOnly: true
EnrollmentCreate:
  type: object
  additionalProperties: false
  required:
  - userId
  - role
  properties:
    userId:
      type: string
      format: uuid
    role:
      $ref: '#/EnrollmentRole'
EnrollmentUpdate:
  example: {"role": "student"}
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    role:
      $ref: '#/EnrollmentRole'
    active:
      type: boolean
  maxProperties: 1
  description: Exactamente role o active. Cambio de rol desactiva origen y devuelve
    sucesor; origen inactivo produce 409. Reactivar con duplicado activo produce 409.
EnrollmentListResponse:
  unevaluatedProperties: false
  allOf:
  - $ref: ./common.yaml#/PageInfo
  - type: object
    required:
    - items
    properties:
      items:
        type: array
        items:
          $ref: '#/Enrollment'
SectionParticipant:
  type: object
  additionalProperties: false
  description: Proyección mínima de un participante activo; sin correo, historial,
    auditoría ni indicadores administrativos.
  required:
  - userId
  - name
  - roles
  properties:
    userId:
      type: string
      format: uuid
      readOnly: true
    name:
      type: string
    roles:
      type: array
      minItems: 1
      uniqueItems: true
      description: Roles activos del usuario en esta sección, ordenados teacher, assistant,
        student. Un usuario con varios roles aparece una sola vez.
      items:
        $ref: '#/EnrollmentRole'
SectionParticipantListResponse:
  type: object
  additionalProperties: false
  required:
  - items
  properties:
    items:
      type: array
      description: Ordenado por rol principal (teacher, assistant, student), nombre
        e identificador.
      items:
        $ref: '#/SectionParticipant'
