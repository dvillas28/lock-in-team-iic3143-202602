InstitutionSummary:
  type: object
  additionalProperties: false
  required:
  - id
  - slug
  - name
  - active
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    slug:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
    name:
      type: string
    active:
      type: boolean
      readOnly: true
InstitutionListResponse:
  example: {"items": [{"id": "00000000-0000-4000-8000-000000000001", "slug": "institucion-demo", "name": "Institución de demostración", "active": true}]}
  type: object
  additionalProperties: false
  required:
  - items
  properties:
    items:
      type: array
      description: Institutions activas y visibles para el User autenticado.
      items:
        $ref: '#/InstitutionSummary'
InstitutionMembershipSummary:
  type: object
  additionalProperties: false
  required:
  - id
  - institution
  - active
  - isAdmin
  - isSuperAdmin
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    institution:
      $ref: '#/InstitutionSummary'
    active:
      type: boolean
      readOnly: true
    isAdmin:
      type: boolean
      readOnly: true
    isSuperAdmin:
      type: boolean
      readOnly: true
  description: Pertenencia institucional; no contiene roles académicos.
SectionMembershipSummary:
  type: object
  additionalProperties: false
  required:
  - courseId
  - sectionId
  - role
  properties:
    courseId:
      type: string
      format: uuid
    sectionId:
      type: string
      format: uuid
    role:
      type: string
      enum:
      - teacher
      - assistant
      - student
CurrentUser:
  example: {"id": "00000000-0000-4000-8000-000000000001", "email": "persona@example.test", "name": "Persona de prueba", "institutionMembership": {"id": "00000000-0000-4000-8000-000000000001", "institution": {"id": "00000000-0000-4000-8000-000000000001", "slug": "institucion-demo", "name": "Institución de demostración", "active": true}, "active": true, "isAdmin": false, "isSuperAdmin": false}, "sectionMemberships": []}
  type: object
  additionalProperties: false
  required:
  - id
  - email
  - name
  - institutionMembership
  - sectionMemberships
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    email:
      type: string
      format: email
    name:
      type: string
    institutionMembership:
      $ref: '#/InstitutionMembershipSummary'
    sectionMemberships:
      type: array
      items:
        $ref: '#/SectionMembershipSummary'
UserSummary:
  type: object
  additionalProperties: false
  required:
  - id
  - email
  - name
  - active
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    email:
      type: string
      format: email
    name:
      type: string
    active:
      type: boolean
UserListResponse:
  unevaluatedProperties: false
  allOf:
  - $ref: ./common.yaml#/PageInfo
  - type: object
    required:
    - items
    properties:
      items:
        type: array
        items:
          $ref: '#/UserSummary'
MembershipAdmin:
  type: object
  additionalProperties: false
  required:
  - id
  - user
  - isAdmin
  - isSuperAdmin
  - active
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    user:
      $ref: '#/UserSummary'
    isAdmin:
      type: boolean
    isSuperAdmin:
      type: boolean
      readOnly: true
    active:
      type: boolean
      readOnly: true
MembershipAdminUpdate:
  type: object
  additionalProperties: false
  required:
  - isAdmin
  properties:
    isAdmin:
      type: boolean
MembershipAdminListResponse:
  unevaluatedProperties: false
  allOf:
  - $ref: ./common.yaml#/PageInfo
  - type: object
    required:
    - items
    properties:
      items:
        type: array
        items:
          $ref: '#/MembershipAdmin'
