MaterialKind:
  type: string
  enum:
  - markdown
MaterialSummary:
  type: object
  required:
  - id
  - moduleId
  - title
  - kind
  - publishedAt
  - createdBy
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    moduleId:
      type: string
      format: uuid
      readOnly: true
    title:
      type: string
      minLength: 1
      maxLength: 200
    kind:
      $ref: '#/MaterialKind'
    publishedAt:
      type:
      - string
      - 'null'
      format: date-time
      readOnly: true
    createdBy:
      type: string
      format: uuid
      readOnly: true
MarkdownMaterial:
  unevaluatedProperties: false
  allOf:
  - $ref: '#/MaterialSummary'
  - type: object
    required:
    - markdownBody
    properties:
      kind:
        const: markdown
      markdownBody:
        type: string
        minLength: 1
        maxLength: 10000
Material:
  $ref: '#/MarkdownMaterial'
MaterialListResponse:
  type: object
  additionalProperties: false
  required:
  - items
  properties:
    items:
      type: array
      items:
        $ref: '#/Material'
MarkdownMaterialCreate:
  type: object
  additionalProperties: false
  required:
  - title
  - markdownBody
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
    markdownBody:
      type: string
      minLength: 1
      maxLength: 10000
      description: Cadena inerte; no blanco, sin NUL. JSON HTTP máximo heredado 4096
        bytes (413). No se renderiza HTML ni se siguen URLs.
MarkdownMaterialUpdate:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
    markdownBody:
      type: string
      minLength: 1
      maxLength: 10000
      description: Cadena inerte; no blanco, sin NUL. JSON HTTP máximo heredado 4096
        bytes (413). No se renderiza HTML ni se siguen URLs.
MaterialUpdate:
  $ref: '#/MarkdownMaterialUpdate'
