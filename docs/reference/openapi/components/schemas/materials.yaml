MaterialKind:
  type: string
  enum:
    - markdown
    - file

MaterialContentType:
  type: string
  enum:
    - application/pdf
    - text/csv
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    - text/plain
    - image/jpeg
    - image/png

MaterialSummary:
  type: object
  required:
    - id
    - moduleId
    - title
    - kind
    - publishedAt
    - createdBy
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    moduleId:
      type: string
      format: uuid
      readOnly: true
    title:
      type: string
    kind:
      $ref: '#/MaterialKind'
    publishedAt:
      type: [string, 'null']
      format: date-time
      readOnly: true
    createdBy:
      type: string
      format: uuid
      readOnly: true

MarkdownMaterial:
  unevaluatedProperties: false
  allOf:
    - $ref: '#/MaterialSummary'
    - type: object
      required:
        - markdownBody
      properties:
        kind:
          const: markdown
        markdownBody:
          type: string

FileMaterial:
  unevaluatedProperties: false
  allOf:
    - $ref: '#/MaterialSummary'
    - type: object
      required:
        - filename
        - contentType
        - sizeBytes
      properties:
        kind:
          const: file
        filename:
          type: string
        contentType:
          $ref: '#/MaterialContentType'
        sizeBytes:
          type: integer
          minimum: 0

Material:
  oneOf:
    - $ref: '#/MarkdownMaterial'
    - $ref: '#/FileMaterial'
  discriminator:
    propertyName: kind
    mapping:
      markdown: '#/MarkdownMaterial'
      file: '#/FileMaterial'

MaterialListResponse:
  type: object
  additionalProperties: false
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: '#/Material'

MarkdownMaterialCreate:
  type: object
  additionalProperties: false
  required:
    - title
    - markdownBody
  properties:
    title:
      type: string
    markdownBody:
      type: string

MarkdownMaterialUpdate:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    title:
      type: string
    markdownBody:
      type: string

FileMaterialUpdate:
  type: object
  additionalProperties: false
  required:
    - title
  properties:
    title:
      type: string

MaterialUpdate:
  anyOf:
    - $ref: '#/MarkdownMaterialUpdate'
    - $ref: '#/FileMaterialUpdate'

FileMaterialUpload:
  type: object
  additionalProperties: false
  required:
    - title
    - file
  properties:
    title:
      type: string
    file:
      type: string
      format: binary
      description: Archivo PDF, CSV, XLSX, TXT, JPEG o PNG.
