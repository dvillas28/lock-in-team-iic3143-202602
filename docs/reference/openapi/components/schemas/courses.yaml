CourseSummary:
  type: object
  additionalProperties: false
  required:
  - id
  - code
  - name
  - term
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    code:
      type: string
      minLength: 1
      maxLength: 32
    name:
      type: string
      minLength: 1
      maxLength: 200
    term:
      type: string
      example: 2026-2
      minLength: 1
      maxLength: 16
Course:
  type: object
  additionalProperties: false
  required:
  - id
  - code
  - name
  - term
  - createdAt
  - createdBy
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    code:
      type: string
      minLength: 1
      maxLength: 32
    name:
      type: string
      minLength: 1
      maxLength: 200
    term:
      type: string
      example: 2026-2
      minLength: 1
      maxLength: 16
    createdAt:
      type: string
      format: date-time
      readOnly: true
    createdBy:
      type: string
      format: uuid
      readOnly: true
CourseUpdate:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    code:
      type: string
      minLength: 1
      maxLength: 32
    name:
      type: string
      minLength: 1
      maxLength: 200
    term:
      type: string
      minLength: 1
      maxLength: 16
CourseListResponse:
  type: object
  additionalProperties: false
  required:
  - items
  properties:
    items:
      type: array
      items:
        $ref: '#/CourseSummary'
CourseModule:
  type: object
  additionalProperties: false
  required:
  - id
  - courseId
  - title
  - position
  - publishedAt
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    courseId:
      type: string
      format: uuid
      readOnly: true
    title:
      type: string
      minLength: 1
      maxLength: 200
      description: Título recortado; 1–200 caracteres Unicode, sin NUL.
    position:
      type: integer
      minimum: 1
      maximum: 2147483647
      format: int32
    publishedAt:
      type:
      - string
      - 'null'
      format: date-time
      readOnly: true
ModuleCreate:
  type: object
  additionalProperties: false
  required:
  - title
  - position
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
      description: Título recortado; 1–200 caracteres Unicode, sin NUL.
    position:
      type: integer
      minimum: 1
      maximum: 2147483647
      format: int32
ModuleUpdate:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
      description: Título recortado; 1–200 caracteres Unicode, sin NUL.
  required:
  - title
ModuleOrderRequest:
  type: object
  additionalProperties: false
  required:
  - moduleIds
  properties:
    moduleIds:
      type: array
      minItems: 0
      uniqueItems: true
      description: Todos los módulos del curso, en el orden final deseado.
      items:
        type: string
        format: uuid
ModuleListResponse:
  type: object
  additionalProperties: false
  required:
  - items
  properties:
    items:
      type: array
      items:
        $ref: '#/CourseModule'
CourseCreate:
  type: object
  additionalProperties: false
  required:
  - code
  - name
  - term
  - initialSection
  properties:
    code:
      type: string
      minLength: 1
      maxLength: 32
    name:
      type: string
      minLength: 1
      maxLength: 200
    term:
      type: string
      minLength: 1
      maxLength: 16
    initialSection:
      $ref: ./sections.yaml#/SectionCreate
