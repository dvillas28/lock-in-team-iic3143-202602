name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      # The trigger is a glob, so reject anything that is not a strict vMAJOR.MINOR.PATCH tag.
      - name: Ensure tag is SemVer
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$GITHUB_REF_NAME" =~ $semver ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a vMAJOR.MINOR.PATCH SemVer tag"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          # Full history so the tagged commit can be checked against main.
          fetch-depth: 0

      # Only release code that already went through a PR, CI and deploy on main.
      - name: Ensure tag points to a commit on main
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
