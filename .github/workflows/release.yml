name: Release

on:
  push:
    branches: [main, dev]

permissions:
  contents: write

# Queue pushes per branch so two runs never compute the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ github.ref_name == 'main' && 'GitHub release' || 'Dev prerelease tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and tags to compute the next version.
          fetch-depth: 0

      - name: Compute next version
        id: next
        env:
          CHANNEL: ${{ github.ref_name == 'main' && 'stable' || 'dev' }}
        run: |
          tag=$(.github/scripts/next-version.sh "$CHANNEL")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Next tag: ${tag:-none (nothing new since the last stable tag)}" >> "$GITHUB_STEP_SUMMARY"

      - name: Push dev tag
        if: github.ref_name == 'dev' && steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      # Tags pushed with GITHUB_TOKEN do not trigger workflows, so main tags and releases in one step.
      - name: Create release
        if: github.ref_name == 'main' && steps.next.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

      # Render deploys after every check passes, this workflow included, so that deploy picks up the new value.
      # Updating a variable through the API does not deploy by itself.
      # A service without changes in the release is not redeployed and keeps showing its last deployed version.
      - name: Set APP_VERSION in Render
        if: github.ref_name == 'main' && steps.next.outputs.tag != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICES: ${{ vars.RENDER_BACKEND_SERVICE_ID }} ${{ vars.RENDER_FRONTEND_SERVICE_ID }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          for service in $SERVICES; do
            curl --fail-with-body --silent --show-error --request PUT \
              "https://api.render.com/v1/services/$service/env-vars/APP_VERSION" \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header "Content-Type: application/json" \
              --data "{\"value\":\"${TAG#v}\"}" > /dev/null
          done
