name: Release

on:
  push:
    branches: [main, dev]

permissions:
  contents: write

# Queue pushes per branch so two runs never compute the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ github.ref_name == 'main' && 'GitHub release' || 'Dev prerelease tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and tags to compute the next version.
          fetch-depth: 0

      - name: Compute next version
        id: next
        env:
          CHANNEL: ${{ github.ref_name == 'main' && 'stable' || 'dev' }}
        run: |
          tag=$(.github/scripts/next-version.sh "$CHANNEL")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Next tag: ${tag:-none (nothing new since the last stable tag)}" >> "$GITHUB_STEP_SUMMARY"

      - name: Push dev tag
        if: github.ref_name == 'dev' && steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      # Tags pushed with GITHUB_TOKEN do not trigger workflows, so main tags and releases in one step.
      - name: Create release
        if: github.ref_name == 'main' && steps.next.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

      # Railway waits for this workflow before deploying, so that deploy picks up the new value.
      # A service without changes in the release is not redeployed and keeps showing its last deployed version.
      - name: Set APP_VERSION in Railway
        if: github.ref_name == 'main' && steps.next.outputs.tag != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          for service in backend frontend; do
            npx --yes @railway/cli@5.63.1 variable set "APP_VERSION=${TAG#v}" \
              --service "$service" --environment production --skip-deploys
          done
