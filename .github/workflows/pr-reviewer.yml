name: PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, dev, feat/bot-pr-reviewer]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review PR
    # No ejecutar en PRs generados por bots automáticos (Dependabot, releases, etc.)
    if: github.actor != 'dependabot[bot]' && !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # fetch-depth: 0 necesario para poder calcular el diff contra la rama base
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run PR Reviewer
        run: node .github/scripts/pr-reviewer.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}

