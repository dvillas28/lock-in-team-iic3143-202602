name: CI

on:
  pull_request:
  # Railway "Wait for CI" only waits on workflows triggered by pushes to the deploy branch.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  documentation:
    name: Documentation length
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check authored documents in this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 .github/scripts/check-doc-length.py --self-test
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 .github/scripts/check-doc-length.py --base "$BASE_SHA"
          else
            python3 .github/scripts/check-doc-length.py --base HEAD~1
          fi

  contracts:
    name: OpenAPI and generated client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm docs:api:lint
      - run: pnpm --dir frontend api:check
      - run: pnpm --dir frontend typecheck

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apps: ${{ steps.apps.outputs.list }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            backend:
              - "backend/**"
              - ".github/workflows/ci.yml"
              - ".github/scripts/trivy.sh"
              - ".trivyignore"
            frontend:
              - "frontend/**"
              - ".github/workflows/ci.yml"
              - ".github/scripts/trivy.sh"
              - ".trivyignore"

      # Manual runs check every app.
      - id: apps
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'list=["backend","frontend"]' >> "$GITHUB_OUTPUT"
          else
            echo "list=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: ${{ matrix.app }} (lint + ${{ matrix.app == 'backend' && 'test' || 'build' }})
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm ${{ matrix.app == 'backend' && 'test' || 'build' }}

  docker:
    name: ${{ matrix.app }} (docker build + trivy)
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag "academix-$APP:ci" "./$APP"

      # The vulnerability DB is published several times a day; one download per day is enough.
      - id: trivy-db
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy-db.outputs.date }}
          restore-keys: trivy-db-

      # Fail only on what we can fix now; unfixed findings still reach the Security tab.
      - name: Trivy scan (dependencies, secrets, Dockerfile)
        run: |
          .github/scripts/trivy.sh fs --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL \
            --scanners vuln,secret,misconfig "$APP"

      - name: Trivy scan (image)
        run: |
          .github/scripts/trivy.sh image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL \
            "academix-$APP:ci"

      - name: Trivy SARIF reports
        if: ${{ !cancelled() }}
        run: |
          .github/scripts/trivy.sh fs --skip-db-update --severity HIGH,CRITICAL --scanners vuln,secret,misconfig \
            --format sarif --output "trivy-fs-$APP.sarif" "$APP"
          .github/scripts/trivy.sh image --skip-db-update --severity HIGH,CRITICAL \
            --format sarif --output "trivy-image-$APP.sarif" "academix-$APP:ci"

      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() }}
        with:
          sarif_file: trivy-fs-${{ matrix.app }}.sarif
          category: trivy-fs-${{ matrix.app }}

      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() }}
        with:
          sarif_file: trivy-image-${{ matrix.app }}.sarif
          category: trivy-image-${{ matrix.app }}

  backend-coverage:
    name: Backend integration + coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: academix_test
          # Disposable CI service only; no production credentials or existing database.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academix_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Configure exclusive test database
        env:
          PGUSER: postgres
          PGPORT: 5432
          PGDATABASE: academix_test
        run: |
          test_url="postgresql://${PGUSER}@127.0.0.1:${PGPORT}/${PGDATABASE}"
          echo "::add-mask::$test_url"
          echo "TEST_DATABASE_URL=$test_url" >> "$GITHUB_ENV"
      - run: pnpm --dir backend test:coverage
      - name: Prepare TypeScript coverage for Sonar
        run: |
          test -s backend/coverage/lcov.info
          sed -i 's|^SF:src/|SF:backend/src/|' backend/coverage/lcov.info
          grep -q '^SF:backend/src/seeds/demo.ts$' backend/coverage/lcov.info
          grep -q '^SF:backend/src/main.ts$' backend/coverage/lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          if-no-files-found: error

  # Static analysis of our own code; the quality gate only judges the code changed by the PR.
  sonarqube:
    name: SonarQube (quality gate)
    needs: backend-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so SonarQube can attribute issues to new code.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      # Generate LCOV in this job so the scanner can read it from the same checkout.
      # Run from the repository root to keep source paths relative to Sonar's base.
      - name: Run frontend tests with coverage
        run: |
          mkdir -p frontend/coverage
          node --test --experimental-test-coverage \
            --test-reporter=spec \
            --test-reporter-destination=stdout \
            --test-reporter=lcov \
            --test-reporter-destination=frontend/coverage/lcov.info \
            frontend/test/*.test.ts
          test -s frontend/coverage/lcov.info
      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      # The gate blocks PRs only; on main the analysis feeds the dashboard and must not block the deploy.
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}

  # Single required check: skipped matrix jobs never report their per-app check names.
  result:
    name: CI result
    if: always()
    needs: [documentation, contracts, changes, checks, docker, backend-coverage, sonarqube]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
