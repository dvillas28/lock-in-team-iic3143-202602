name: CI

# Pushes to main only run Release: the dev -> main PR already ran CI on the same tree.
# Sonar and Trivy dashboards for main are refreshed with the manual workflows.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  documentation:
    name: Documentation length
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check authored documents in this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 .github/scripts/check-doc-length.py --self-test
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 .github/scripts/check-doc-length.py --base "$BASE_SHA"
          else
            python3 .github/scripts/check-doc-length.py --base HEAD~1
          fi

  contracts:
    name: OpenAPI and generated client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm docs:api:lint
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm docs:api:test
      - run: pnpm docs:api:build
      - uses: actions/upload-artifact@v4
        with:
          name: api-catalog
          path: dist/api-catalog/
          if-no-files-found: error
      - run: pnpm --dir frontend api:check
      - run: pnpm --dir frontend typecheck

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apps: ${{ steps.apps.outputs.list }}
      integration: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.integration == 'true' }}
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            backend:
              - "backend/**"
              - ".github/workflows/ci.yml"
              - ".github/scripts/trivy.sh"
              - ".trivyignore"
            frontend:
              - "frontend/**"
              - ".github/workflows/ci.yml"
              - ".github/scripts/trivy.sh"
              - ".trivyignore"
            # Backend integration also reads the OpenAPI catalog, the generated frontend
            # client and the Compose files.
            integration:
              - "backend/**"
              - "docs/reference/openapi/**"
              - "frontend/src/lib/api/**"
              - "frontend/package.json"
              - "frontend/pnpm-lock.yaml"
              - "docker-compose*.yml"
              - ".github/workflows/ci.yml"

      # Manual runs check every app.
      - id: apps
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'list=["backend","frontend"]' >> "$GITHUB_OUTPUT"
          else
            # `changes` also lists non-app filters such as `integration`.
            echo "list=$(jq -c 'map(select(. == "backend" or . == "frontend"))' <<< "$CHANGED")" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: ${{ matrix.app }} (lint + ${{ matrix.app == 'backend' && 'test' || 'build' }})
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm ${{ matrix.app == 'backend' && 'test' || 'build' }}

  # Blocking: a broken Dockerfile must not reach the Render deploy.
  docker:
    name: ${{ matrix.app }} (docker build)
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Shares the layer cache with the trivy job, so the second build of the same tree is cheap.
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Non-blocking: not listed in `result`. A failure shows red on the PR without blocking the merge;
  # the manual Trivy workflow keeps the full report for the course audit.
  trivy:
    name: ${{ matrix.app }} (trivy)
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Rebuilt here instead of passed as an artifact: with the shared cache it is faster
      # than uploading the image tarball, and both jobs stay parallel.
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          load: true
          tags: academix-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # The vulnerability DB is published several times a day; one download per day is enough.
      - id: trivy-db
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy-db.outputs.date }}
          restore-keys: trivy-db-

      # Fail only on what we can fix now; unfixed findings still reach the Security tab.
      - name: Trivy scan (dependencies, secrets, Dockerfile)
        run: |
          .github/scripts/trivy.sh fs --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL \
            --scanners vuln,secret,misconfig "$APP"

      - name: Trivy scan (image)
        run: |
          .github/scripts/trivy.sh image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL \
            "academix-$APP:ci"

      - name: Trivy SARIF reports
        if: ${{ !cancelled() }}
        run: |
          .github/scripts/trivy.sh fs --skip-db-update --severity HIGH,CRITICAL --scanners vuln,secret,misconfig \
            --format sarif --output "trivy-fs-$APP.sarif" "$APP"
          .github/scripts/trivy.sh image --skip-db-update --severity HIGH,CRITICAL \
            --format sarif --output "trivy-image-$APP.sarif" "academix-$APP:ci"

      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() }}
        with:
          sarif_file: trivy-fs-${{ matrix.app }}.sarif
          category: trivy-fs-${{ matrix.app }}

      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() }}
        with:
          sarif_file: trivy-image-${{ matrix.app }}.sarif
          category: trivy-image-${{ matrix.app }}

  backend-coverage:
    name: Backend integration + coverage
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: academix_test
          # Disposable CI service only; no production credentials or existing database.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academix_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir backend install --frozen-lockfile
      # Integration exercises the generated frontend client against real HTTP.
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Configure exclusive test database
        env:
          PGUSER: postgres
          PGPORT: 5432
          PGDATABASE: academix_test
        run: |
          test_url="postgresql://${PGUSER}@127.0.0.1:${PGPORT}/${PGDATABASE}"
          echo "::add-mask::$test_url"
          echo "TEST_DATABASE_URL=$test_url" >> "$GITHUB_ENV"
          runtime_url="postgresql://academix_runtime:ci_runtime@127.0.0.1:${PGPORT}/${PGDATABASE}"
          echo "::add-mask::$runtime_url"
          echo "TEST_RUNTIME_DATABASE_URL=$runtime_url" >> "$GITHUB_ENV"
      - run: pnpm --dir backend test:coverage
      - name: Validate backend image and isolated Compose
        run: node backend/test/compose-smoke.mjs
      - name: Prepare TypeScript coverage for Sonar
        run: |
          test -s backend/coverage/lcov.info
          sed -i 's|^SF:src/|SF:backend/src/|' backend/coverage/lcov.info
          grep -q '^SF:backend/src/seeds/demo.ts$' backend/coverage/lcov.info
          grep -q '^SF:backend/src/main.ts$' backend/coverage/lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          if-no-files-found: error

  # Rehearses the deploy predeploy (migrations + runtime role) on a throwaway Neon branch copied
  # from production, so a migration that breaks on real data blocks the release PR, not the deploy.
  # Only dev -> main PRs from this repository (forks get no secrets) and manual runs.
  # Decision and setup: docs/adr/neon-migration-rehearsal.md.
  migration-rehearsal:
    name: Migration rehearsal (Neon)
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' && (github.event_name == 'workflow_dispatch' ||
      (github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Neon API key lives in this environment only: no other job can read it.
    environment: neon-rehearsal
    env:
      NEON_BRANCH: ci-rehearsal-${{ github.event.pull_request.number || 'manual' }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check Neon configuration
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_DATABASE: ${{ vars.NEON_DATABASE }}
        run: |
          for name in NEON_API_KEY NEON_PROJECT_ID NEON_DATABASE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing in the neon-rehearsal environment (docs/adr/neon-migration-rehearsal.md)"
              exit 1
            fi
          done
          # Safety net if the delete step never runs (runner lost, job killed).
          echo "NEON_EXPIRES_AT=$(date -u --date '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir backend build

      # Parent is the project's default branch: production. The owner URL comes back direct (not -pooler).
      - name: Create Neon branch from production
        id: branch
        uses: neondatabase/create-branch-action@v6.4.0
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ env.NEON_BRANCH }}
          database: ${{ vars.NEON_DATABASE }}
          role: ${{ vars.NEON_OWNER_ROLE || 'neondb_owner' }}
          ssl: verify-full
          expires_at: ${{ env.NEON_EXPIRES_AT }}

      # Neon keeps no password for roles created by SQL, and production's runtime secret stays in
      # Render: academix_runtime gets a random password on this branch only. `created` guarantees the
      # URL belongs to the branch this run just made, never to an existing (production) branch.
      - name: Run predeploy against the branch
        working-directory: backend
        env:
          CREATED: ${{ steps.branch.outputs.created }}
          OWNER_URL: ${{ steps.branch.outputs.db_url }}
          DEMO_DATA_ENABLED: "false"
        run: |
          set -euo pipefail
          if [ "$CREATED" != "true" ]; then
            echo "::error::Neon reused an existing branch named $NEON_BRANCH; refusing to touch it"
            exit 1
          fi
          export RUNTIME_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$RUNTIME_PASSWORD"
          # Keep only the URL parameters the backend accepts, with verified TLS.
          { read -r MIGRATION_DATABASE_URL; read -r DATABASE_URL; } < <(node -e '
            const owner = new URL(process.env.OWNER_URL);
            owner.search = "?sslmode=verify-full";
            const runtime = new URL(owner.href);
            runtime.username = "academix_runtime";
            runtime.password = process.env.RUNTIME_PASSWORD;
            console.log(owner.href);
            console.log(runtime.href);
          ')
          echo "::add-mask::$MIGRATION_DATABASE_URL"
          echo "::add-mask::$DATABASE_URL"
          export MIGRATION_DATABASE_URL DATABASE_URL
          node -e '
            const {Client} = require("pg");
            const {operationalConfig} = require("./dist/database/config");
            (async () => {
              const admin = new Client(operationalConfig());
              await admin.connect();
              try {
                const literal = (await admin.query("SELECT quote_literal($1) AS value", [process.env.RUNTIME_PASSWORD])).rows[0].value;
                await admin.query(`ALTER ROLE academix_runtime PASSWORD ${literal}`);
              } finally { await admin.end(); }
            })().catch(error => { console.error(`::error::Could not set the rehearsal runtime password (${error.code ?? "connection"})`); process.exit(1); });
          '
          pnpm db:predeploy

      - name: Delete Neon branch
        if: always() && steps.branch.outputs.created == 'true'
        uses: neondatabase/delete-branch-action@v3.2.1
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.branch.outputs.branch_id }}

  # Static analysis of our own code; the quality gate only judges the code changed by the PR.
  # Runs when app code changed; backend coverage is attached only if integration ran.
  # Non-blocking: not listed in `result`, so a failed gate shows red on the PR without blocking it.
  sonarqube:
    name: SonarQube (quality gate)
    needs: [changes, backend-coverage]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.apps != '[]'
      && needs.backend-coverage.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so SonarQube can attribute issues to new code.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      # Generate LCOV in this job so the scanner can read it from the same checkout.
      # Run from the repository root to keep source paths relative to Sonar's base.
      - name: Run frontend tests with coverage
        env:
          TSX_TSCONFIG_PATH: frontend/tsconfig.json
        run: |
          mkdir -p frontend/coverage
          frontend/node_modules/.bin/c8 --all --src frontend/src --check-coverage --lines 80 --branches 80 --reporter=text --reporter=lcov \
            --reports-dir=frontend/coverage \
            node --import ./frontend/node_modules/tsx/dist/loader.mjs --test \
            frontend/test/*.test.ts
          test -s frontend/coverage/lcov.info
      - uses: actions/download-artifact@v4
        if: needs.backend-coverage.result == 'success'
        with:
          name: backend-coverage
          path: backend/coverage

      # The gate blocks PRs only; manual runs feed the dashboard without waiting for it.
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}

  # Single required check: skipped matrix jobs never report their per-app check names.
  # `trivy` and `sonarqube` are left out on purpose: they report but do not block.
  # `migration-rehearsal` is skipped outside dev -> main PRs, which counts as passing here.
  result:
    name: CI result
    if: always()
    needs: [documentation, contracts, changes, checks, docker, backend-coverage, migration-rehearsal]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
